# Mímir Release Pipeline
# Triggers on version tags (v*) to build and push Docker images

name: Release

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: docker.io
  API_IMAGE: dawsonlp/mimir-api
  POSTGRES_IMAGE: dawsonlp/mimir-postgres

permissions:
  contents: write

jobs:
  release:
    name: Build and Push
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:master

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/infrastructure/docker/api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ steps.version.outputs.VERSION }}
            ${{ env.API_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push PostgreSQL image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/infrastructure/docker/postgres/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.POSTGRES_IMAGE }}:${{ steps.version.outputs.VERSION }}
            ${{ env.POSTGRES_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          body: |
            ## Docker Images
            - `${{ env.API_IMAGE }}:${{ steps.version.outputs.VERSION }}`
            - `${{ env.POSTGRES_IMAGE }}:${{ steps.version.outputs.VERSION }}`