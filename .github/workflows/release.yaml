# Mímir Release Pipeline
# Triggers on version tags (v*) to build and push Docker images

name: Release

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: docker.io
  API_IMAGE: dawsonlp/mimir-api

permissions:
  contents: write

jobs:
  release:
    name: Build and Push
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:master

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/}
          echo "VERSION=${TAG_VERSION}" >> $GITHUB_OUTPUT
          echo "PYPI_VERSION=${TAG_VERSION#v}" >> $GITHUB_OUTPUT

      - name: Validate package versions match tag
        run: |
          python - <<'PY'
          import os
          import tomllib

          tag_version = os.environ["GITHUB_REF"].removeprefix("refs/tags/v")

          with open("backend/pyproject.toml", "rb") as f:
              backend_version = tomllib.load(f)["project"]["version"]
          with open("clients/python/pyproject.toml", "rb") as f:
              client_version = tomllib.load(f)["project"]["version"]

          if backend_version != tag_version:
              raise SystemExit(
                  f"backend version {backend_version} does not match tag {tag_version}"
              )
          if client_version != tag_version:
              raise SystemExit(
                  f"mimir-client version {client_version} does not match tag {tag_version}"
              )
          PY

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/infrastructure/docker/api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ steps.version.outputs.VERSION }}
            ${{ env.API_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          body: |
            ## Docker Images
            - `${{ env.API_IMAGE }}:${{ steps.version.outputs.VERSION }}`
            - `${{ env.API_IMAGE }}:latest`
            
            ## Python Client
            - `pip install mimir-client==${{ steps.version.outputs.PYPI_VERSION }}`

  publish-client:
    name: Publish mimir-client to PyPI
    runs-on: ubuntu-latest
    needs: release

    steps:
      - uses: actions/checkout@v4

      - name: Extract tag version
        id: tag
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=${TAG_VERSION}" >> $GITHUB_OUTPUT

      - name: Extract mimir-client version
        id: client
        run: |
          CLIENT_VERSION=$(python - <<'PY'
          import tomllib
          with open("clients/python/pyproject.toml", "rb") as f:
              print(tomllib.load(f)["project"]["version"])
          PY
          )
          echo "VERSION=${CLIENT_VERSION}" >> $GITHUB_OUTPUT

      - name: Set up Python
        if: steps.client.outputs.VERSION == steps.tag.outputs.VERSION
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        if: steps.client.outputs.VERSION == steps.tag.outputs.VERSION
        uses: astral-sh/setup-uv@v4

      - name: Build mimir-client
        if: steps.client.outputs.VERSION == steps.tag.outputs.VERSION
        run: |
          cd clients/python
          uv build

      - name: Publish to PyPI
        if: steps.client.outputs.VERSION == steps.tag.outputs.VERSION
        run: |
          cd clients/python
          uv publish --token ${{ secrets.PYPI_API_TOKEN }}
