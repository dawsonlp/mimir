# Mímir CI Pipeline
# Runs on push to main and pull requests

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.13"

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Create venv and install deps
        run: |
          uv venv .venv
          source .venv/bin/activate
          uv pip install ".[dev]"

      - name: Run ruff linter
        run: .venv/bin/ruff check src/ tests/

      - name: Run ruff formatter check
        run: .venv/bin/ruff format --check src/ tests/

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Create venv and install deps
        run: |
          uv venv .venv
          source .venv/bin/activate
          uv pip install ".[dev]"

      - name: Run unit tests
        run: .venv/bin/pytest tests/unit -v

      # Integration tests require full stack (AGE, pgvector, migrations, running API).
      # Run locally with: docker compose up && pytest tests/integration -v

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/infrastructure/docker/api/Dockerfile
          push: false
          tags: mimir-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max