# Mímir - Development overrides - hot reload and debugging
# This file is automatically applied with docker-compose.yaml

services:
  migrate:
    build:
      context: .
      dockerfile: infrastructure/docker/api/Dockerfile
      target: builder  # Use builder stage with dependencies
    volumes:
      # Mount migrations for local development
      - ./src/mimir:/app/mimir:ro
      - ./migrations:/app/migrations:ro

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api/Dockerfile
      target: builder  # Use builder stage for dev
    volumes:
      # Mount package directly to match production layout (/app/mimir/)
      # src/ is project organization only - contents deployed directly
      - ./src/mimir:/app/mimir:ro
      - ./migrations:/app/migrations:ro
    environment:
      LOG_LEVEL: DEBUG
    # Override CMD for hot reload in development
    command: ["uvicorn", "mimir.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/mimir"]
