# Mímir - Development overrides - hot reload via volume mounts
# This file is automatically applied with docker-compose.yaml

services:
  migrate:
    build:
      context: .
      dockerfile: infrastructure/docker/api/Dockerfile
    volumes:
      - ./src/mimir:/app/mimir:ro
      - ./migrations:/app/migrations:ro
    environment:
      PYTHONPATH: /app

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api/Dockerfile
    volumes:
      # Mount package directly to match production layout (/app/mimir/)
      # src/ is project organization only - contents deployed directly
      - ./src/mimir:/app/mimir:ro
      - ./migrations:/app/migrations:ro
    environment:
      LOG_LEVEL: DEBUG
      PYTHONPATH: /app  # Mounted source takes precedence over installed package in venv
    # Override CMD for hot reload in development
    command: >
      uvicorn mimir.main:app
      --host 0.0.0.0 --port 8000
      --reload --reload-dir /app/mimir