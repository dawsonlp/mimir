[project]
name = "mimir"
# SINGLE SOURCE OF TRUTH for version.
# All other files (__init__.py, config.py, main.py) read from here via importlib.metadata.
# To release: bump this version, commit, tag (vX.Y.Z), push. CI builds and deploys automatically.
version = "5.5.1"
description = "Mímir - Durable Memory & Meta-Analysis Storage System"
authors = [{name = "Development Team"}]
readme = "README.md"
requires-python = ">=3.14"

dependencies = [
    # Core - FastAPI stack
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",

    # Database - PostgreSQL with pgvector (NO ORM - raw SQL via psycopg)
    "psycopg[binary,pool]",
    "pgvector",

    # Logging
    "structlog",

    # HTTP client for external APIs (embedding providers)
    "httpx",

    # CLI tools
    "typer",
    "rich",

    # Change outbox publisher
    "confluent-kafka>=2.14.2",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest",
    "pytest-asyncio",
    "httpx",
    "testcontainers",

    # Code quality
    "black",
    "ruff",
    "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mimir"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: tests that require a running database/API"
]

[tool.mypy]
python_version = "3.14"
mypy_path = "src"
# Pragmatic approach - only enable checks that catch real bugs
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
# Keep flexible for dynamic code
disallow_untyped_defs = false
disallow_incomplete_defs = false
warn_return_any = false

[tool.ruff]
src = ["src"]
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line length - handled by formatter
    "B008",   # function call in defaults - standard FastAPI Query/Header pattern
    "B017",   # pytest.raises(Exception) - acceptable in validation tests
    "W291",   # trailing whitespace - occurs in SQL/HTML multiline strings
    "W293",   # blank line with whitespace - same as W291
    "SIM102", # nested if → combined if - style preference, not worth risk
    "SIM105", # try/except/pass → contextlib.suppress - style preference
    "UP042",  # str+Enum → StrEnum - may affect Pydantic serialization
]

[tool.ruff.lint.isort]
known-first-party = ["mimir"]

[tool.black]
target-version = ["py314"]
line-length = 88
