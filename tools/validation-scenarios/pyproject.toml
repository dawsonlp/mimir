[project]
name = "mimir-validation-scenarios"
version = "0.1.0"
description = "CLI tool for validating Mímir V2 API through real-world scenarios"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.9",
    "rich>=13",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "langchain-core>=0.3",
    "langchain-ollama>=0.3",
    "langchain-anthropic>=0.3",
]

[project.scripts]
mimir-validate = "validation_scenarios.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/validation_scenarios"]