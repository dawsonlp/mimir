[tool.poetry]
name = "mimir-chat-ui"
version = "0.1.0"
description = "Textual-based Chat UI - thin client for chat backends"
authors = ["Mimir Team"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.13"
textual = "^3.0"
httpx = "^0.28"
python-dotenv = "^1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.24"
textual-dev = "^1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"